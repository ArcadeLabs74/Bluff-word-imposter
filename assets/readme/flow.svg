<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Tactical Mission Workflow &amp; System Architecture</title>
  <desc id="flowDesc">Step-by-step game loop: Setup, Serverless AI generation, Realtime Clue Passing, and Emergency Vote.</desc>

  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f18"/>
      <stop offset="100%" stop-color="#08140f"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="280" rx="20" fill="#070f0c" stroke="#1c3629" stroke-width="1.6"/>

  <!-- Section Header -->
  <g transform="translate(48, 34)">
    <text x="0" y="0" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="2">SYSTEM WORKFLOW // TACTICAL MISSION CYCLE</text>
  </g>

  <!-- Step 1: Lobby Setup -->
  <g transform="translate(48, 62)">
    <rect width="250" height="174" rx="16" fill="url(#stepBg)" stroke="#234233" stroke-width="1.2"/>
    <rect x="18" y="16" width="34" height="24" rx="6" fill="#183628" stroke="#33664d" stroke-width="1"/>
    <text x="28" y="32" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">01</text>
    <text x="62" y="32" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">LOBBY &amp; CONFIG</text>
    <text x="18" y="72" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Local Pass &amp; Play (1 device)</text>
    <text x="18" y="94" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Supabase Realtime Room (Multi)</text>
    <text x="18" y="116" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• 10+ Curated Decks or Custom</text>
    <text x="18" y="146" fill="#5a7366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">3–12 PLAYERS · 1–3 IMPOSTERS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 314 149 L 338 149" stroke="#3d6651" stroke-width="2" stroke-linecap="round"/>
  <polygon points="338,144 346,149 338,154" fill="#3d6651"/>

  <!-- Step 2: AI Word & Hint Synthesis -->
  <g transform="translate(356, 62)">
    <rect width="250" height="174" rx="16" fill="url(#stepBg)" stroke="#234233" stroke-width="1.2"/>
    <rect x="18" y="16" width="34" height="24" rx="6" fill="#183628" stroke="#33664d" stroke-width="1"/>
    <text x="28" y="32" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">02</text>
    <text x="62" y="32" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">AI SECRET ENGINE</text>
    <text x="18" y="72" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Supabase Edge Function</text>
    <text x="18" y="94" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Gemini 2.5 Flash synthesis</text>
    <text x="18" y="116" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Cryptic hint for the imposter</text>
    <text x="18" y="146" fill="#5a7366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">ZERO CLIENT-SIDE KEY EXPOSURE</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 622 149 L 646 149" stroke="#3d6651" stroke-width="2" stroke-linecap="round"/>
  <polygon points="646,144 654,149 646,154" fill="#3d6651"/>

  <!-- Step 3: Role Reveal & Clue Rounds -->
  <g transform="translate(664, 62)">
    <rect width="250" height="174" rx="16" fill="url(#stepBg)" stroke="#234233" stroke-width="1.2"/>
    <rect x="18" y="16" width="34" height="24" rx="6" fill="#183628" stroke="#33664d" stroke-width="1"/>
    <text x="28" y="32" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">03</text>
    <text x="62" y="32" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">CLUE DISCUSSION</text>
    <text x="18" y="72" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• 3D flip card role reveal</text>
    <text x="18" y="94" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Timed round discussion passes</text>
    <text x="18" y="116" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Real-time synchronized feed</text>
    <text x="18" y="146" fill="#5a7366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">60S CLUE PASSES · PASS DEVICE</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 930 149 L 954 149" stroke="#3d6651" stroke-width="2" stroke-linecap="round"/>
  <polygon points="954,144 962,149 954,154" fill="#3d6651"/>

  <!-- Step 4: Emergency Vote & Results -->
  <g transform="translate(972, 62)">
    <rect width="180" height="174" rx="16" fill="url(#stepBg)" stroke="#234233" stroke-width="1.2"/>
    <rect x="18" y="16" width="34" height="24" rx="6" fill="#183628" stroke="#33664d" stroke-width="1"/>
    <text x="28" y="32" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">04</text>
    <text x="62" y="32" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">VOTE &amp; VERDICT</text>
    <text x="18" y="72" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Emergency voting</text>
    <text x="18" y="94" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Ballot decryption</text>
    <text x="18" y="116" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">• Ejection &amp; victory</text>
    <text x="18" y="146" fill="#5a7366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600">BALLOT SUMMARY</text>
  </g>
</svg>
