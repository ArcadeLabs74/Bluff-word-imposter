<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Guess The Imposter — Social Deduction Party Game</title>
  <desc id="heroDesc">Bento UI preview matching the website with Pass and Play, Online multiplayer, and secret word deduction.</desc>

  <defs>
    <!-- Filter for soft card shadows matching the site -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1713" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background (Exact website background: #e5ebe4) -->
  <rect width="1200" height="460" rx="28" fill="#e5ebe4" stroke="#d2ded3" stroke-width="2"/>

  <!-- Top Navigation Pill (Matches the website app-top-nav) -->
  <g transform="translate(36, 22)">
    <rect width="1128" height="42" rx="21" fill="#ffffff" stroke="rgba(11, 23, 19, 0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Brand on left -->
    <circle cx="24" cy="21" r="4.5" fill="#22c55e"/>
    <circle cx="24" cy="21" r="8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <text x="40" y="25" fill="#0b1713" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.2">GTI // SOCIAL DEDUCTION</text>

    <!-- Center text -->
    <text x="564" y="26" text-anchor="middle" fill="#5a8a72" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">PASS &amp; PLAY OR ONLINE MULTIPLAYER</text>

    <!-- Status on right -->
    <rect x="1008" y="7" width="106" height="28" rx="14" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.12)" stroke-width="1"/>
    <text x="1061" y="24.5" text-anchor="middle" fill="#0b1713" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10.5" font-weight="700">3–12 PLAYERS</text>
  </g>

  <!-- Left Bento Card (White card matching HomeScreen) -->
  <g transform="translate(36, 78)">
    <rect width="528" height="352" rx="24" fill="#ffffff" stroke="rgba(11, 23, 19, 0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Eyebrow label -->
    <text x="28" y="38" fill="#5a8a72" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.5">PARTY GAME · ZERO SETUP</text>

    <!-- Big Headline (Matches site font and styling) -->
    <text x="28" y="76" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">BLEND IN TECH.</text>
    <text x="28" y="112" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">READY FOR THE UNKNOWN.</text>

    <!-- Plain, honest description (no buzzwords) -->
    <text x="28" y="146" fill="#475b52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Everyone receives the secret word except the imposter.</text>
    <text x="28" y="166" fill="#475b52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Take turns giving one clue, spot who's bluffing, and vote before they escape.</text>

    <!-- Player Roster Pills (Matches HomeScreen player rows) -->
    <g transform="translate(28, 192)">
      <!-- Player 1 -->
      <g transform="translate(0, 0)">
        <rect width="226" height="38" rx="19" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.1)" stroke-width="1"/>
        <circle cx="19" cy="19" r="13" fill="#3b82f6"/>
        <text x="19" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">P</text>
        <text x="40" y="23" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Player 1</text>
      </g>
      <!-- Player 2 -->
      <g transform="translate(246, 0)">
        <rect width="226" height="38" rx="19" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.1)" stroke-width="1"/>
        <circle cx="19" cy="19" r="13" fill="#10b981"/>
        <text x="19" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">P</text>
        <text x="40" y="23" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Player 2</text>
      </g>
      <!-- Player 3 -->
      <g transform="translate(0, 48)">
        <rect width="226" height="38" rx="19" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.1)" stroke-width="1"/>
        <circle cx="19" cy="19" r="13" fill="#f59e0b"/>
        <text x="19" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">P</text>
        <text x="40" y="23" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Player 3</text>
      </g>
      <!-- Player 4 -->
      <g transform="translate(246, 48)">
        <rect width="226" height="38" rx="19" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.1)" stroke-width="1"/>
        <circle cx="19" cy="19" r="13" fill="#d44732"/>
        <text x="19" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">P</text>
        <text x="40" y="23" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Player 4</text>
      </g>
    </g>

    <!-- Start Button Pill at bottom -->
    <g transform="translate(28, 296)">
      <rect width="472" height="40" rx="20" fill="#0b1713"/>
      <text x="236" y="24.5" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1">▶  START GAME (4 PLAYERS) ↗</text>
    </g>
  </g>

  <!-- Right Top Bento Card: The Signature Deep Green Card (#284437) -->
  <g transform="translate(582, 78)">
    <rect width="582" height="204" rx="24" fill="#284437" filter="url(#cardShadow)"/>

    <!-- Inverted Corner Notch Dock on Bottom-Right -->
    <path d="M 386 204 L 386 160 C 386 146 398 146 410 146 L 582 146 L 582 204 Z" fill="#e5ebe4"/>
    <!-- Concave fillet: Top-Right of notch dock -->
    <path d="M 582 118 C 582 134 598 146 582 146 Z" fill="#e5ebe4"/>

    <!-- Mode switch buttons inside the notch dock -->
    <g transform="translate(398, 156)">
      <!-- Local button active -->
      <rect x="0" y="0" width="82" height="36" rx="8" fill="#284437"/>
      <text x="41" y="22" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10.5" font-weight="700">📱 LOCAL</text>
      <!-- Online button inactive -->
      <rect x="88" y="0" width="86" height="36" rx="8" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.12)" stroke-width="1"/>
      <text x="131" y="22" text-anchor="middle" fill="#475b52" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10.5" font-weight="700">🌐 ONLINE</text>
    </g>

    <!-- Card Content -->
    <g transform="translate(28, 26)">
      <!-- Title -->
      <text x="0" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">BUILT FOR THE FIELD.</text>
      <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">TRUSTED IN THE ROOM. NEVER GET CAUGHT.</text>

      <!-- Stat row -->
      <text x="0" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">01</text>
      <text x="64" y="94" fill="#7da58f" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">IMPOSTER</text>

      <!-- Bullets -->
      <circle cx="4" cy="132" r="3" fill="#7da58f"/>
      <text x="14" y="135" fill="#dfe9e1" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">4 ACTIVE CREW</text>

      <circle cx="120" cy="132" r="3" fill="#7da58f"/>
      <text x="130" y="135" fill="#dfe9e1" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">2 ROUNDS</text>

      <circle cx="204" cy="132" r="3" fill="#7da58f"/>
      <text x="214" y="135" fill="#dfe9e1" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">PASS &amp; PLAY</text>
    </g>
  </g>

  <!-- Right Bottom Bento Card: Role Reveal Split Specimen -->
  <g transform="translate(582, 300)">
    <rect width="582" height="130" rx="20" fill="#ffffff" stroke="rgba(11, 23, 19, 0.12)" stroke-width="1.2" filter="url(#cardShadow)"/>

    <!-- Left side: Crew view -->
    <g transform="translate(18, 16)">
      <rect width="264" height="98" rx="14" fill="#f1f5ef" stroke="rgba(11, 23, 19, 0.08)" stroke-width="1"/>
      <rect x="12" y="10" width="104" height="20" rx="10" fill="#dfe9e1"/>
      <text x="64" y="23.5" text-anchor="middle" fill="#284437" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="9" font-weight="700">CREW VIEW</text>
      <text x="12" y="48" fill="#73877d" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="9" font-weight="700">SECRET WORD:</text>
      <text x="12" y="74" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800">SUPERNOVA</text>
      <text x="12" y="90" fill="#5a8a72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Category: Sci-Fi &amp; Space</text>
    </g>

    <!-- Right side: Imposter view -->
    <g transform="translate(300, 16)">
      <rect width="264" height="98" rx="14" fill="#fdf2f0" stroke="rgba(212, 71, 50, 0.18)" stroke-width="1"/>
      <rect x="12" y="10" width="118" height="20" rx="10" fill="#fee2e2"/>
      <text x="71" y="23.5" text-anchor="middle" fill="#d44732" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="9" font-weight="700">IMPOSTER VIEW</text>
      <text x="12" y="48" fill="#b53825" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="9" font-weight="700">YOUR CLUE HINT:</text>
      <text x="12" y="68" fill="#0b1713" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">"A dying star explosion"</text>
      <text x="12" y="88" fill="#73877d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Bluff your clue to blend in</text>
    </g>
  </g>
</svg>
