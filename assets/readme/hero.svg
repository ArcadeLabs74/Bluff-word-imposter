<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Guess The Imposter — AI-Powered Social Deduction Party Game</title>
  <desc id="desc">Hero banner showcasing the tactical bento UI, real-time multiplayer, and serverless Gemini AI secret word generation.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f0c"/>
      <stop offset="60%" stop-color="#0c1a14"/>
      <stop offset="100%" stop-color="#14261e"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142920"/>
      <stop offset="100%" stop-color="#0e1f18"/>
    </linearGradient>

    <linearGradient id="crewGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a8a72"/>
      <stop offset="100%" stop-color="#7da58f"/>
    </linearGradient>

    <linearGradient id="imposterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b53825"/>
      <stop offset="100%" stop-color="#d44732"/>
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(125, 165, 143, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Outer Container -->
  <rect width="1200" height="420" rx="28" fill="url(#bgGrad)" stroke="#1a3327" stroke-width="2"/>
  <rect width="1200" height="420" rx="28" fill="url(#gridPattern)"/>

  <!-- Left Column: Branding & Project Anatomy -->
  <g id="hero-identity" transform="translate(56, 44)">
    <!-- Eyebrow Badge -->
    <g transform="translate(0, 0)">
      <rect width="254" height="32" rx="16" fill="#13271e" stroke="#254736" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4.5" fill="#22c55e"/>
      <circle cx="16" cy="16" r="8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
      <text x="32" y="20.5" fill="#8fa59a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.5">GTI // SOCIAL DEDUCTION</text>
    </g>

    <!-- Main Display Title -->
    <text x="0" y="98" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">GUESS THE IMPOSTER</text>

    <!-- Plain-Language Value Proposition -->
    <text x="0" y="136" fill="#7da58f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">The AI-Powered Social Deduction Party Game</text>
    <text x="0" y="168" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Everyone receives the secret word except the undercover infiltrator.</text>
    <text x="0" y="190" fill="#9db0a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Drop subtle clues, read the room, and vote before they escape.</text>

    <!-- Feature Architecture Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Gemini AI -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#14261f" stroke="#274635" stroke-width="1"/>
        <text x="16" y="20" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">✦ GEMINI 2.5 FLASH</text>
      </g>
      <!-- Pill 2: Supabase Realtime -->
      <g transform="translate(190, 0)">
        <rect width="186" height="32" rx="16" fill="#14261f" stroke="#274635" stroke-width="1"/>
        <text x="16" y="20" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">⚡ SUPABASE REALTIME</text>
      </g>
    </g>

    <g transform="translate(0, 272)">
      <!-- Pill 3: Pass & Play -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#14261f" stroke="#274635" stroke-width="1"/>
        <text x="16" y="20" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">📱 1-PHONE PASS &amp; PLAY</text>
      </g>
      <!-- Pill 4: Realtime Rooms -->
      <g transform="translate(190, 0)">
        <rect width="186" height="32" rx="16" fill="#14261f" stroke="#274635" stroke-width="1"/>
        <text x="16" y="20" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">🌐 MULTI-DEVICE LOBBY</text>
      </g>
    </g>

    <!-- Tech Specs Line -->
    <g transform="translate(0, 332)">
      <text x="0" y="0" fill="#5a7366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" letter-spacing="1">REACT 19 · TYPESCRIPT · VITE 8 · TAILORED BENTO UI</text>
    </g>
  </g>

  <!-- Right Column: Interactive Game Proof Board (Inverted Corner Notch Bento) -->
  <g id="hero-proof" transform="translate(640, 36)">
    <!-- Bento Main Card with Cutout Corner -->
    <rect width="504" height="348" rx="24" fill="url(#cardGrad)" stroke="#234233" stroke-width="1.8"/>

    <!-- Top Card Header -->
    <g transform="translate(24, 22)">
      <text x="0" y="16" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">ACTIVE MISSION DOSSIER</text>
      <rect x="360" y="2" width="94" height="22" rx="11" fill="#0d1b14" stroke="#1c3629" stroke-width="1"/>
      <circle cx="372" cy="13" r="3.5" fill="#22c55e"/>
      <text x="382" y="17" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700">ROOM: GTI-48</text>
    </g>

    <!-- Crew Member Secret Reveal Card -->
    <g transform="translate(24, 56)">
      <rect width="456" height="116" rx="16" fill="#0b1713" stroke="#234533" stroke-width="1.2"/>
      <!-- Role Badge -->
      <rect x="18" y="16" width="138" height="22" rx="11" fill="#132e22" stroke="#2a6147" stroke-width="1"/>
      <text x="28" y="31" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700">🛡️ CREWMATE VIEW</text>

      <!-- Category & Secret Word -->
      <text x="18" y="60" fill="#7da58f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="1">DECK: SCI-FI &amp; SPACE</text>
      <text x="18" y="92" fill="#f4f8f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1">SUPERNOVA</text>
      <text x="18" y="106" fill="#527060" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Give a subtle clue without revealing the exact identity to the imposter.</text>
    </g>

    <!-- Imposter Bluff Card -->
    <g transform="translate(24, 184)">
      <rect width="456" height="116" rx="16" fill="#130d0c" stroke="#4a1c16" stroke-width="1.2"/>
      <!-- Role Badge -->
      <rect x="18" y="16" width="144" height="22" rx="11" fill="#361410" stroke="#782318" stroke-width="1"/>
      <text x="28" y="31" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700">🕵️ IMPOSTER VIEW</text>

      <!-- Cryptic AI Hint -->
      <text x="18" y="60" fill="#c47166" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" letter-spacing="1">CRYPTIC AI HINT (GEMINI 2.5 FLASH):</text>
      <text x="18" y="88" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" font-style="italic">"A violent, luminous stellar explosion ending a star's lifecycle."</text>
      <text x="18" y="106" fill="#8f5751" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Blend in, improvise clues, and deflect suspicion during emergency vote.</text>
    </g>

    <!-- Bottom Operatives Roster Bar -->
    <g transform="translate(24, 314)">
      <text x="0" y="13" fill="#668574" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700" letter-spacing="1">OPERATIVES (4/12):</text>
      <!-- Dots & Names -->
      <circle cx="132" cy="9" r="7" fill="#3b82f6"/>
      <circle cx="152" cy="9" r="7" fill="#10b981"/>
      <circle cx="172" cy="9" r="7" fill="#f59e0b"/>
      <circle cx="192" cy="9" r="7" fill="#ef4444"/>
      <text x="214" y="13" fill="#8fa59a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">2 CLUE ROUNDS · EMERGENCY VOTING ACTIVE</text>
    </g>
  </g>
</svg>
